<!DOCTYPE html>
<html lang="en" th:replace="~{base::layout(~{::main})}">

<main>

    <section class="login-section">
        <div class="login-card">

            <div class="row g-0">

                <!-- Left Info Panel -->
                <div class="col-sm-6 login-info-panel">

                    <div class="icon-box">
                        <i class="bi bi-shield-fill-check"></i>
                    </div>

                    <h2>Welcome back</h2>

                    <p>
                        Sign in to manage your workspace,
                        track your team and stay on top of
                        everything that matters.
                    </p>

                    <div class="feature-item">
                        <i class="bi bi-check-lg"></i>
                        <span>Secure role-based access</span>
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-lg"></i>
                        <span>Built for admins & employees</span>
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-lg"></i>
                        <span>Fast, reliable, always available</span>
                    </div>

                </div>

                <!-- Right Login Panel -->
                <div class="col-sm-6 login-form-panel">

                    <h1>Login</h1>

                    <p class="subtitle">
                        Enter your credentials to continue
                    </p>

                    <!-- Error Message -->
                    <div th:if="${msg}" class="alert alert-danger">
                        <span th:text="${msg}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">

                        <label class="form-label">Email Address</label>

                        <div class="input-group-custom">
                            <i class="bi bi-envelope"></i>
                            <input
                                type="email"
                                name="emailaddress"
                                placeholder="Enter Email Address"
                                required>
                        </div>

                        <label class="form-label mt-3">Password</label>

                        <div class="input-group-custom">
                            <i class="bi bi-lock"></i>
                            <input
                                type="password"
                                name="password"
                                placeholder="Enter Password"
                                required>
                        </div>

                        <button type="submit" class="btn-login-gradient mt-4">
                            Login
                            <i class="bi bi-arrow-right ms-1"></i>
                        </button>

                        <a href="#" class="forgot-link">
                            Forgot Password?
                        </a>

                    </form>

                </div>

            </div>

        </div>
    </section>

</main>

</html>
